plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rspec_rails

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "db/*schema.rb"
    - "node_modules/**/*"
    - "storage/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

# Rails generates files without a frozen_string_literal magic comment.
Style/FrozenStringLiteralComment:
  Enabled: false

# Rails' own idiom for classes; requiring a top-level comment on every one is noise.
Style/Documentation:
  Enabled: false

# rspec-rails' infer_spec_type_from_file_location! is deliberately left off (see
# CLAUDE.md), so the type tag this cop calls redundant is in fact required.
RSpecRails/InferredSpecType:
  Enabled: false
